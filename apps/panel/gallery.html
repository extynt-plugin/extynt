<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>extynt panel gallery</title>
<!--
  Design review page, never shipped. Append ?solo&theme=dark&only=cards|receipts|composer|messages|rest to render one group.
  Open it as is for the matrix: every component in both themes at 360 (the reference),
  260 (the minimum) and 480 px. Each cell is this same file loaded as ?solo&theme=dark|light, rendered with the real
  stylesheets, so the container queries see the cell's own width. Append ?solo&theme=light to see one theme full page.
-->
<link rel="stylesheet" href="styles/tokens.css"><link rel="stylesheet" href="styles/base.css"><link rel="stylesheet" href="styles/layout.css">
<link rel="stylesheet" href="styles/components/badge-dot.css"><link rel="stylesheet" href="styles/components/context.css"><link rel="stylesheet" href="styles/components/setup-card.css"><link rel="stylesheet" href="styles/components/status-bar.css"><link rel="stylesheet" href="styles/components/sheet.css"><link rel="stylesheet" href="styles/components/page.css"><link rel="stylesheet" href="styles/components/message.css"><link rel="stylesheet" href="styles/components/notice.css"><link rel="stylesheet" href="styles/components/plan-card.css"><link rel="stylesheet" href="styles/components/receipt.css"><link rel="stylesheet" href="styles/components/variant.css"><link rel="stylesheet" href="styles/components/list-row.css"><link rel="stylesheet" href="styles/components/composer.css"><link rel="stylesheet" href="styles/components/menu.css"><link rel="stylesheet" href="styles/components/empty-state.css"><link rel="stylesheet" href="styles/components/settings.css"><link rel="stylesheet" href="styles/components/diagnostics.css">
<style>
  body.solo { height: auto; overflow: visible; padding: 0 0 24px; }
  body.matrix { height: auto; overflow: auto; min-width: 0; padding: 24px; container-type: normal; }
  .g-sec { padding: var(--s4) var(--s3) 0; }
  .g-sec > h3 { margin: 0 0 var(--s2); color: var(--faint); font-size: var(--fs-meta); font-weight: 600; letter-spacing: 0; }
  .g-box { display: flex; flex-direction: column; gap: var(--s3); }
  .g-app { height: 860px; border-block: 1px solid var(--line); }
  .g-drawer .drawer { position: static; width: auto; height: auto; transform: none; visibility: visible; border: 1px solid var(--line); }
  .g-drawer .drawer-body { overflow: visible; }
  .g-menu .menu { position: static; width: 100%; max-width: none; }
  .g-pop .plan-notices { margin-bottom: 110px; }
  .g-pop .notice-pop { position: absolute; top: 24px; left: 0; display: block; width: 240px; }
  .g-menuhost .msg.plan-card { margin-bottom: 80px; }
  .g-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3); }
  .g-matrix { display: flex; flex-direction: column; gap: 32px; }
  .g-matrix h2 { margin: 0 0 var(--s2); font-size: var(--fs-title); }
  .g-cells { display: flex; gap: 24px; align-items: flex-start; }
  .g-cells iframe { flex: none; border: 1px solid var(--line-strong); background: var(--bg); }
</style></head><body>

  function iconSvg(name) {
    var spec = EXTYNT_GALLERY_ICONS[name];
    var shapes = spec.shapes.map(function (shape) {
      var attrs = Object.keys(shape).filter(function (k) { return k !== "tag"; }).map(function (k) { return (k === "fillRule" ? "fill-rule" : k === "clipRule" ? "clip-rule" : k) + "='" + shape[k] + "'"; });
      return "<" + shape.tag + " " + attrs.join(" ") + " fill='currentColor'/>";
    }).join("");
    return "<svg class='icon icon-" + name + "' viewBox='0 0 " + spec.size + " " + spec.size + "' aria-hidden='true'>" + shapes + "</svg>";
  }
  function renderSolo(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    document.body.className = "solo";
    var holder = document.createElement("div");
    holder.innerHTML = document.getElementById("specimen").innerHTML.replace(/<i data-icon="(\w+)"><\/i>/g, function (_, name) { return iconSvg(name); });
    holder.querySelectorAll("img[data-frame]").forEach(function (img) { img.src = frameUri(img.getAttribute("data-frame")); });
    var only = query.get("only");
    if (only) Array.prototype.slice.call(holder.children).forEach(function (child) { if ((child.getAttribute("data-group") || "misc") !== only) holder.removeChild(child); });
    document.body.appendChild(holder);
    window.addEventListener("load", function () { parent.postMessage({ galleryHeight: document.documentElement.scrollHeight, theme: theme, width: innerWidth }, "*"); });
  }
  function renderMatrix() {
    document.body.className = "matrix";
    var matrix = document.createElement("div");
    matrix.className = "g-matrix";
    [360, 260, 480].forEach(function (width) {
      var row = document.createElement("div");
      row.innerHTML = "<h2>" + width + " px" + (width === 360 ? " (reference)" : width === 260 ? " (minimum)" : "") + "</h2>";
      var cells = document.createElement("div");
      cells.className = "g-cells";
      ["dark", "light"].forEach(function (theme) {
        var frame = document.createElement("iframe");
        frame.src = "gallery.html?solo&theme=" + theme;
        frame.title = theme + " at " + width + " px";
        frame.style.width = width + "px";
        frame.style.height = "2400px";
        frame.setAttribute("data-theme-name", theme);
        cells.appendChild(frame);
      });
      row.appendChild(cells);
      matrix.appendChild(row);
    });
    document.body.appendChild(matrix);
    window.addEventListener("message", function (event) {
      if (!event.data || !event.data.galleryHeight) return;
      document.querySelectorAll("iframe").forEach(function (frame) { if (frame.contentWindow === event.source) frame.style.height = event.data.galleryHeight + "px"; });
    });
  }
  if (query.has("solo")) renderSolo(query.get("theme") === "light" ? "light" : "dark"); else renderMatrix();
</script>
