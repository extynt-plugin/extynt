<!doctype html>
<!-- Source of the Installer window background (background.png, background-dark.png): paper or ink, with the tagline
     and the extynt wordmark bottom-left in line with the Go Back / Continue buttons. Rendered by catalogue-window/preview.sh --backgrounds;
     ?theme=dark gives the ink version. The canvas is larger than the 620 x 416 window so no edge ever shows. -->
<html><head><meta charset="utf-8">
<style>
  :root { --bg: #f4f2ec; --ink: #151515; --frame: #151515; --drop: #151515; --faint: #6a675f; --red: #b3341c; }
  :root.dark { --bg: #151515; --ink: #f4f2ec; --frame: #f4f2ec; --drop: #4a4741; --faint: #a9a59b; --red: #ec7a5f; }
  html, body { margin: 0; width: 700px; height: 480px; background: var(--bg); overflow: hidden; }
  .brand { position: absolute; left: 20px; bottom: 15px; display: flex; color: var(--ink); }
  .word { height: 16px; display: block; }
  /* Installer's page box is 418 x 331 at 182 from the left and 49 from the bottom (macOS 13.5 to 15). Its border is
     translucent, so the frame under it turns that border to ink; the drop is extynt.com's hard offset shadow. */
  .drop, .frame { position: absolute; left: 182px; bottom: 49px; width: 418px; height: 331px; }
  .drop { transform: translate(6px, 6px); background: var(--drop); }
  .frame { background: var(--frame); }
  /* The tagline, set like extynt.com's hero: semibold, tight, the turn of the line in brick red. */
  .tagline { position: absolute; left: 20px; bottom: 54px; width: 150px; margin: 0; color: var(--ink); font: 600 17px/1.12 "IBM Plex Sans", -apple-system, "Helvetica Neue", sans-serif; letter-spacing: -0.02em; }
  .tagline em { font-style: normal; color: var(--red); }
  .tagline::before { content: ""; display: block; width: 18px; height: 1.5px; margin-bottom: 10px; background: var(--ink); }
</style></head>
<body>
