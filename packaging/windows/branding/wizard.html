<!doctype html>
<!-- Source of the Setup wizard images (wizard-*.bmp, wizard-small-*.bmp, light and dark), rendered by scripts/render-wizard-images.ts.
     ?kind=side (164 x 314) or ?kind=small (55 x 55), &theme=dark for the ink version. The look is background.html's
     in packaging/macos/release/branding: paper or ink, the tagline with a short rule above it and its turn in brick red,
     the wordmark, an ink frame with extynt.com's hard offset shadow. -->
<html><head><meta charset="utf-8">
<style>
  :root { --bg: #f4f2ec; --ink: #151515; --drop: #151515; --red: #b3341c; }
  :root.dark { --bg: #151515; --ink: #f4f2ec; --drop: #4a4741; --red: #ec7a5f; }
  html, body { margin: 0; background: var(--bg); overflow: hidden; color: var(--ink); }
  .side, .small { display: none; position: relative; }
  .side.on { display: block; width: 164px; height: 314px; }
  .small.on { display: block; width: 55px; height: 55px; }
  .drop, .frame { position: absolute; box-sizing: border-box; }
  .side .drop { left: 14px; top: 14px; width: 136px; height: 286px; transform: translate(5px, 5px); background: var(--drop); }
  .side .frame { left: 14px; top: 14px; width: 136px; height: 286px; border: 2px solid var(--ink); background: var(--bg); }
  .tagline { position: absolute; left: 26px; top: 36px; margin: 0; font: 600 15.5px/1.12 "IBM Plex Sans", "Segoe UI", Arimo, "Liberation Sans", sans-serif; letter-spacing: -0.02em; }
  .tagline em { font-style: normal; color: var(--red); }
  .tagline::before { content: ""; display: block; width: 18px; height: 1.5px; margin-bottom: 10px; background: var(--ink); }
  .word { position: absolute; left: 26px; bottom: 30px; height: 15px; }
  .small .drop { left: 6px; top: 6px; width: 40px; height: 40px; transform: translate(4px, 4px); background: var(--drop); }
  .small .frame { left: 6px; top: 6px; width: 40px; height: 40px; border: 2px solid var(--ink); background: var(--bg); }
  .small .word { left: 11px; bottom: auto; top: 21px; height: 12px; width: 28px; }
</style></head>
